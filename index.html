<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>My Reading List</title>
  <meta name="description" content="A reading list app: add books, mark them as read and keep track of your progress.">
  <link rel="preload" href="assets/fonts/press-start-2p-latin-400-normal.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="assets/fonts/vt323-latin-400-normal.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="app">
    <h1 class="title">My Reading List</h1>

    <form class="panel form" id="book-form" novalidate>
      <div class="field">
        <label for="title">Book title</label>
        <input id="title" name="title" type="text" maxlength="80" autocomplete="off" required>
      </div>
      <div class="field">
        <label for="author">Author</label>
        <input id="author" name="author" type="text" maxlength="60" autocomplete="off" required>
      </div>
      <p class="error" id="form-error" role="alert"></p>
      <button class="btn btn--primary" type="submit">Add book</button>
    </form>

    <section class="panel" aria-labelledby="shelf-title">
      <div class="shelf__head">
        <h2 class="shelf__title" id="shelf-title">Your shelf</h2>
        <p class="stats" id="stats" aria-live="polite">0 books</p>
      </div>

      <div class="filters" role="group" aria-label="Filter books">
        <button class="chip is-active" type="button" data-filter="all" aria-pressed="true">All</button>
        <button class="chip" type="button" data-filter="unread" aria-pressed="false">To read</button>
        <button class="chip" type="button" data-filter="read" aria-pressed="false">Read</button>
      </div>

      <ul class="books" id="books"></ul>
      <p class="empty" id="empty" hidden></p>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
